name: Farabi CI
on:
  push:
    branches: [main, 'feature/**', 'feat/**', 'fix/**', 'docs/**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ensure Docker is available for PostgreSQL integration tests
        run: |
          if ! docker info >/dev/null 2>&1; then
            sudo systemctl start docker
          fi
          docker info
      - run: mvn --batch-mode --no-transfer-progress verify
