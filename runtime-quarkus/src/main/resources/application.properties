quarkus.http.limits.max-body-size=${FARABI_IMPORT_HTTP_MAX_BODY_SIZE:520M}
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${FARABI_JDBC_URL}
quarkus.datasource.username=${FARABI_DB_USER}
quarkus.datasource.password=${FARABI_DB_PASSWORD}
farabi.dremio.url=${FARABI_DREMIO_URL}
farabi.dremio.token=${FARABI_DREMIO_TOKEN}

# Enable explicitly in deployments that have the import schema and storage mounted.
quarkus.scheduler.enabled=${FARABI_IMPORT_WORKER_ENABLED:false}
farabi.import.poll-interval=${FARABI_IMPORT_POLL_INTERVAL:2s}
farabi.import.heartbeat-interval=${FARABI_IMPORT_HEARTBEAT_INTERVAL:30s}
farabi.import.worker.id=${FARABI_IMPORT_WORKER_ID:farabi-quarkus-worker}
farabi.import.lease-duration=${FARABI_IMPORT_LEASE_DURATION:PT2M}
farabi.import.storage.root=${FARABI_IMPORT_STORAGE_ROOT:/var/lib/farabi/datasets}
farabi.import.max-attempts=${FARABI_IMPORT_MAX_ATTEMPTS:5}

# Storage provider is selected at build time: local (default) or s3.
farabi.import.storage.provider=${FARABI_IMPORT_STORAGE_PROVIDER:local}
farabi.import.max-bytes=${FARABI_IMPORT_MAX_BYTES:536870912}
farabi.import.storage.temp-root=${FARABI_IMPORT_TEMP_ROOT:/var/tmp/farabi-datasets}
farabi.import.s3.bucket=${FARABI_IMPORT_S3_BUCKET:}
farabi.import.s3.region=${FARABI_IMPORT_S3_REGION:ap-southeast-1}
farabi.import.s3.endpoint=${FARABI_IMPORT_S3_ENDPOINT:}

# Default quota for newly seen workspaces (10 GiB); per-workspace overrides are managed operationally.
farabi.import.storage.default-quota-bytes=${FARABI_IMPORT_STORAGE_DEFAULT_QUOTA_BYTES:10737418240}

# Provider inventory reconciliation: objects younger than this are not reported as orphans.
farabi.import.storage.orphan-grace-period=${FARABI_IMPORT_STORAGE_ORPHAN_GRACE_PERIOD:PT24H}

# Durable provider inventory jobs are disabled by default; enable scheduler explicitly per deployment.
farabi.storage.inventory.poll-interval=${FARABI_STORAGE_INVENTORY_POLL_INTERVAL:off}
farabi.storage.inventory.worker-id=${FARABI_STORAGE_INVENTORY_WORKER_ID:farabi-storage-inventory-worker}
farabi.storage.inventory.lease-duration=${FARABI_STORAGE_INVENTORY_LEASE_DURATION:PT2M}
farabi.storage.inventory.max-attempts=${FARABI_STORAGE_INVENTORY_MAX_ATTEMPTS:4}
